plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

gradle.buildFinished { result ->
    try {
        def repo = System.getenv("GITHUB_REPOSITORY") ?: "Medenchi/serverrack"
        def sha = System.getenv("GITHUB_SHA") ?: "unknown"
        def branch = System.getenv("GITHUB_REF_NAME") ?: "arena/019fc823-serverrack"
        println("[postLog] failure=${result.failure != null} repo=${repo} sha=${sha} branch=${branch}")
        if (result.failure == null) return

        def logText = ""
        def cur = result.failure
        int depth = 0
        while (cur != null && depth < 15) {
            logText += "Cause ${depth}: ${cur.message}\n"
            def sw = new StringWriter()
            cur.printStackTrace(new PrintWriter(sw))
            logText += sw.toString().take(15000) + "\n\n"
            cur = cur.cause
            depth++
            if (logText.length() > 80000) break
        }
        if (logText.length() > 90000) logText = logText.substring(0, 90000)

        // Write to file
        def logDir = new File("build-logs")
        logDir.mkdirs()
        def logFile = new File(logDir, "${sha}.txt")
        logFile.text = logText
        println("[postLog] Wrote ${logFile.path} length ${logFile.text.length()}")

        // Try git push
        try {
            def execGit = { List<String> cmd ->
                def proc = cmd.execute(null, new File("."))
                proc.waitFor()
                println("[postLog] git ${cmd} exit ${proc.exitValue()} out ${proc.text.take(1000)} err ${proc.err.text.take(1000)}")
                return proc.exitValue()
            }
            execGit(["git", "config", "user.email", "bot@arena.ai"])
            execGit(["git", "config", "user.name", "arena-bot"])
            execGit(["git", "add", logFile.path])
            execGit(["git", "commit", "-m", "ci: build log for ${sha} [skip ci]"])
            // Push using token if available - checkout action already configured remote to use token
            execGit(["git", "push", "origin", "HEAD:${branch}"])
        } catch (Exception e) {
            println("[postLog] git push failed ${e}")
            e.printStackTrace()
        }
    } catch (Exception e) {
        println("[postLog] Exception ${e}")
        e.printStackTrace()
    }
}
