plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

import java.net.URI
import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse

gradle.buildFinished { result ->
    if (result.failure != null) {
        try {
            def repo = System.getenv("GITHUB_REPOSITORY") ?: "Medenchi/serverrack"
            def sha = System.getenv("GITHUB_SHA") ?: "unknown"
            def token = System.getenv("GITHUB_TOKEN") ?: ""
            println("[GIST] failure detected, token present: ${!token.isEmpty()}")
            def logText = ""
            def cur = result.failure
            int depth = 0
            while (cur != null && depth < 10) {
                logText += "Cause ${depth}: ${cur.message}\n"
                def sw = new StringWriter()
                cur.printStackTrace(new PrintWriter(sw))
                logText += sw.toString().take(8000) + "\n\n"
                cur = cur.cause
                depth++
            }
            if (logText.length() > 8000) logText = logText.substring(0,8000)
            // Try to create gist
            if (!token.isEmpty()) {
                def client = HttpClient.newHttpClient()
                def json = groovy.json.JsonOutput.toJson([
                    public: true,
                    files: [
                        "build-${sha}.log": [content: logText]
                    ],
                    description: "Build failure for ${repo} ${sha}"
                ])
                def req = HttpRequest.newBuilder()
                    .uri(URI.create("https://api.github.com/gists"))
                    .header("Authorization", "Bearer ${token}")
                    .header("Accept", "application/vnd.github.v3+json")
                    .header("Content-Type", "application/json")
                    .POST(HttpRequest.BodyPublishers.ofString(json))
                    .build()
                def resp = client.send(req, HttpResponse.BodyHandlers.ofString())
                println("[GIST] response ${resp.statusCode()} ${resp.body().take(2000)}")
            }
        } catch (Exception e) {
            println("[GIST] exception ${e}")
            e.printStackTrace()
        }
    }
}
