plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// === POST BUILD STATUS TO COMMIT COMMENT ===
import java.net.URI
import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse

gradle.buildFinished { result ->
    try {
        def repo = System.getenv("GITHUB_REPOSITORY") ?: "Medenchi/serverrack"
        def sha = System.getenv("GITHUB_SHA") ?: "unknown"
        def token = System.getenv("GITHUB_TOKEN") ?: ""
        println("[postLog] repo=${repo} sha=${sha} tokenPresent=${!token.isEmpty()} failure=${result.failure != null}")
        if (token.isEmpty()) {
            println("[postLog] No token, cannot post")
            return
        }
        def logText = ""
        if (result.failure != null) {
            logText += "Build FAILED\n\n"
            def cur = result.failure
            int depth = 0
            while (cur != null && depth < 10) {
                logText += "Cause ${depth}: ${cur.toString()}\n"
                cur.cause?.let { logText += "  -> ${it}\n" }
                // Try to get stacktrace
                def sw = new StringWriter()
                cur.printStackTrace(new PrintWriter(sw))
                logText += sw.toString().take(5000) + "\n"
                cur = cur.cause
                depth++
            }
            // Try to read any compile output files
            try {
                fileTree(dir: "build", include: "**/*.txt").each { f ->
                    if (f.name.contains("compile") || f.path.contains("tmp")) {
                        logText += "\n--- ${f.path} ---\n" + f.text.take(3000)
                    }
                }
            } catch (Exception e) {
                logText += "\n[postLog] fileTree error ${e}"
            }
        } else {
            logText += "Build SUCCESS\n"
            return // don't spam success comments, but we can for testing once
        }
        if (logText.length() > 60000) logText = logText.substring(0, 60000) + "\n... truncated"
        def client = HttpClient.newHttpClient()
        def json = groovy.json.JsonOutput.toJson([body: "```\n${logText.take(60000)}\n```"])
        def request = HttpRequest.newBuilder()
                .uri(URI.create("https://api.github.com/repos/${repo}/commits/${sha}/comments"))
                .header("Authorization", "Bearer ${token}")
                .header("Accept", "application/vnd.github.v3+json")
                .header("Content-Type", "application/json")
                .POST(HttpRequest.BodyPublishers.ofString(json))
                .build()
        def response = client.send(request, HttpResponse.BodyHandlers.ofString())
        println("[postLog] response ${response.statusCode()} ${response.body().take(1000)}")
    } catch (Exception e) {
        println("[postLog] Exception ${e}")
        e.printStackTrace()
    }
}
