plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

gradle.buildFinished { result ->
    if (result.failure != null) {
        try {
            def token = System.getenv("GITHUB_TOKEN") ?: ""
            def repo = System.getenv("GITHUB_REPOSITORY") ?: "Medenchi/serverrack"
            def sha = System.getenv("GITHUB_SHA") ?: "unknown"
            def branch = System.getenv("GITHUB_REF_NAME") ?: "arena/019fc823-serverrack"
            println("[LOG] token present: ${!token.isEmpty()} sha: ${sha}")

            def logText = ""
            def cur = result.failure
            int depth = 0
            while (cur != null && depth < 10) {
                logText += "Cause ${depth}: ${cur.message}\n"
                def sw = new StringWriter()
                cur.printStackTrace(new PrintWriter(sw))
                logText += sw.toString().take(5000) + "\n\n"
                cur = cur.cause
                depth++
            }

            // Write to file
            def logDir = new File("build-logs")
            logDir.mkdirs()
            def logFile = new File(logDir, "${sha}.txt")
            logFile.text = logText
            println("[LOG] Wrote ${logFile.absolutePath}")

            // Try git push with token in URL
            if (!token.isEmpty()) {
                def exec = { List<String> cmd ->
                    try {
                        def proc = cmd.execute(null, new File("."))
                        proc.waitFor()
                        println("[GIT] cmd ${cmd} exit ${proc.exitValue()} out: ${proc.text.take(2000)} err: ${proc.err.text.take(2000)}")
                        return proc.exitValue()
                    } catch (Exception e) {
                        println("[GIT] exec failed ${e}")
                        return -1
                    }
                }
                exec(["git", "config", "user.email", "bot@arena.ai"])
                exec(["git", "config", "user.name", "arena-bot"])
                exec(["git", "add", logFile.path])
                exec(["git", "commit", "-m", "ci: build log for ${sha} [skip ci]".toString()])
                // Push via token URL
                def remoteUrl = "https://x-access-token:${token}@github.com/${repo}.git"
                exec(["git", "push", remoteUrl, "HEAD:${branch}".toString()])
            }
        } catch (Exception e) {
            println("[LOG] exception ${e}")
            e.printStackTrace()
        }
    }
}
